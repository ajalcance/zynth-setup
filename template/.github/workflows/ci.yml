# ==============================================================================
# CI — quality + security gate
# ==============================================================================
# Runs on every PR, and on pushes to the default branch only (see the cost note below).
# Path-filtered so a docs-only change doesn't run backend/frontend suites; jobs skip when
# their paths are absent — and a skipped job costs nothing.
#
# Actions are pinned to full commit SHAs (with a version comment); Dependabot
# (github-actions) keeps them current. `ci-complete` is the single required check.
# ==============================================================================

name: CI

# COST: GitHub bills per JOB, rounded up to a full minute — job COUNT is the cost driver,
# not job duration. A PR run and the push run that follows the merge test the same tree, so
# `push` is limited to the default branch (post-merge verification); PRs are gated by the
# pull_request run. This roughly halves total runs.
# `types:` is load-bearing, not boilerplate. The meta-guard reads the owner's labels from the
# event payload and the declaration guard reads the PR body the same way — and a re-run replays
# the ORIGINAL payload. Without `labeled`/`edited`, a label applied after the run and a body
# written after the run never took effect, while the check that appeared green had evaluated
# the absent labels and the empty body.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  # Weekly full run. Advisory databases and community rule sets move without us, and the
  # post-merge `reuse` job below means a quiet main may not have been fully re-proved in a
  # while. Monday 06:00 UTC, before the week's first merge. No tag trigger, deliberately:
  # a release tag names a main commit whose push run already ran the audits and proved the
  # tree, and a tag-triggered workflow that restores caches is one zizmor rightly reads as
  # a release build open to cache poisoning. release.yml builds on its own checkout.
  schedule:
    - cron: '0 6 * * 1'

# Cancel a superseded PR run; never cancel a run on the default branch. A cancelled run reports
# a non-success result, so cancelling on `push` lets a main commit carry a cancelled gate — and
# that is the tree a release tag is cut from.
#
# Consequence worth knowing: applying a label fires a new run that cancels the current one, so a
# check rollup shows a FAILURE from the cancelled run beside the live one. Evaluate checks by
# completion time, not by presence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---- Detect which parts of the repo changed -----------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A scheduled run has no base to diff, so paths-filter cannot answer; every part counts
    # as changed and the whole gate runs — which is the point of that run.
    outputs:
      backend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.frontend }}
      docs: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.docs }}
      code: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.code }}
      changelog: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.changelog }}
    steps:
      # paths-filter reads the diff through the API on a pull_request, but through GIT on a
      # push — where it needs `github.event.before` to be present. A shallow clone sends it
      # to `git fetch`, which cannot authenticate once the credential is gone. The failure
      # is invisible on a PR and on the root commit, so it first appears at the very first
      # merge, and takes every gate behind this job with it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            # ALL of docs/: the docs site renders every Markdown file under it, so a change
            # to a decision record or the roadmap can break the site build. Two subfolders
            # used to be listed here, and a docs-only PR could pass CI with the site red.
            docs:
              - 'docs-site/**'
              - 'docs/**'
            code:
              - 'backend/**'
              - 'frontend/src/**'
            changelog:
              - 'CHANGELOG.md'

  # ---- Post-merge reuse: a tree the pull-request run already proved ------------
  # GitHub bills per job, rounded up to a minute, and the push run after a squash merge
  # tests the SAME tree the PR run just passed. This job looks that run up: a merged PR
  # whose head commit has this exact tree hash, with a successful `ci-complete` posted by
  # GitHub Actions itself (not any app of that name — the same rule the ruleset applies).
  # When it finds one, the deterministic jobs stand down. The audits never do: pip-audit
  # and npm audit read databases that move without us, so they run on every push. A
  # scheduled run runs everything. A lookup that FAILS means a full run —
  # `verified` stays unset and every job proceeds — never a skipped one.
  #
  # Why the tree and not the sha: a squash merge is a new commit. Why the PR head's tree
  # and not the merge ref's: the merge ref is gone after the merge, and if main's new tree
  # equals the head's tree, the head already contained everything main had — so the tree
  # the PR run tested (the merge of the two) was this tree too.
  reuse:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Find a successful pull-request run of this exact tree
        id: lookup
        continue-on-error: true # an API error is a full run, not a red default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          verified=false
          for head in $(gh api "repos/$REPO/commits/$SHA/pulls" \
                          --jq '.[] | select(.merged_at != null) | .head.sha'); do
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq '.tree.sha')
            [ "$head_tree" = "$tree" ] || continue
            proof=$(gh api "repos/$REPO/commits/$head/check-runs?check_name=ci-complete" \
                      --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")][0].html_url')
            if [ -n "$proof" ]; then
              echo "reuse: tree $tree was proved by ci-complete on PR head $head — $proof"
              verified=true
              break
            fi
          done
          [ "$verified" = true ] || echo "reuse: no successful pull-request run of tree $tree — full run"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  # ---- Secret + hygiene scanning (always) ---------------------------------
  hygiene:
    needs: [reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # gitleaks is SKIPPED here on purpose. Its pre-commit entry is `protect --staged`, which
      # is right at commit time on a laptop and blind on a clean CI checkout: nothing is staged,
      # so it read nothing and printed Passed on every run for months. Letting a decorative
      # check print Passed is how that stays hidden. The real scan — commits, not the staging
      # area, with a canary that proves it can see — is scripts/secret_scan.py, run by
      # `make policy` in the static job. The local hook stays for commit-time protection.
      - name: Run pre-commit hooks (detect-private-key, hygiene, shellcheck)
        env:
          SKIP: gitleaks
        run: |
          pip install -c requirements-ci.txt pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # ---- SAST: dangerous-ops ruleset + Semgrep security audit (always) ------
  sast:
    needs: [reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # the SARIF upload; nothing else here writes
    steps:
      # Full history, no credential, and NO git fetch in this job: the baseline commit below
      # is a sha from the event payload, which a full clone already contains. That keeps the
      # invariant tests/guards/test_workflow_invariants.py holds — a job drops the credential
      # or runs git against the remote, never neither-nor.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install -c requirements-ci.txt semgrep
      # Both scans live in the Makefile (`make sast`), not here: one definition, as with
      # `make policy`. The community scan was `|| true` with the output discarded — ~44
      # seconds a run, enough to push the job into a second billed minute, for a result
      # nobody ever saw. Now it fails on findings NEW since the base commit and keeps its
      # report. The base is a sha from the event payload: the PR base, or the previous head
      # on a push. On the first push to a ref there is no base, so the whole tree is
      # scanned — which is why the template self-test scans a fresh project with no base.
      - name: Dangerous-ops ruleset + community rules (make sast — new findings block)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline=""
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            baseline="$BASE_SHA"
          fi
          make sast SEMGREP_BASELINE="$baseline"

      # The report is the record; the gate above is the `--error`. Uploading needs code
      # scanning to be enabled on the repository, which a private repo without Advanced
      # Security lacks — so a failed UPLOAD does not fail the job, but a finding always does.
      - name: Keep the Semgrep report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep-community

  # ---- Backend: lint + type + test + Bandit (only if backend/ changed) ----
  backend:
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: ruff check .
      - name: Format check (black)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: black --check .
      - name: Type check (mypy)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: mypy .
      # The identical string `make backend` runs. See the note in the Makefile: -x is a
      # prefix match, so `-x tests` excluded nothing, and `./.venv` (absent here, present
      # for every developer) must be named or the local mirror of this job cannot pass.
      - name: Security (bandit)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: bandit -r . -ll -q -x ./tests,./.venv
      - name: Supply-chain audit (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Tests (pytest + coverage floor)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: pytest -q --cov

  # ---- Frontend: lint + type + test (only if frontend/ changed) -----------
  frontend:
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm run lint
      - name: Format check (prettier)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npx prettier --check .
      - name: Type check (tsc)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npx tsc --noEmit
      # --omit=dev: gate on what actually SHIPS. A high advisory in the production tree
      # (next/react/sharp/postcss) fails the build; a ReDoS in a build-time linter dep that
      # never runs in production does not redden every fresh repo. Dev-tooling advisories are
      # surfaced by Dependabot and the daily scheduled self-test instead.
      - name: Supply-chain audit (npm audit, production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Tests
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm test --if-present
      # Must mirror `make frontend` exactly — a production build break is otherwise only
      # caught post-merge at image-build time (or never). Keep this list in sync.
      - name: Production build (next build)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm run build
      - name: Client bundle-size budget
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm run bundle-size

  # ---- Docs site: lint + build (only if docs-site/ or docs content changed) ----
  docs:
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Must mirror `make docs-site` exactly. Keep this list in sync.
      - name: Lint (eslint)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm run lint
      - name: Format check (prettier)
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npx prettier --check .
      - name: Supply-chain audit (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        if: needs.reuse.outputs.verified != 'true' # proved by the PR run; audits still run
        run: npm run build

  # ---- Static guards, batched (always; blocking) ---------------------------
  # doc-guards, the dependency pin guard, the meta-guard and the docs-sync nudge were four
  # separate jobs, each finishing in well under 10 seconds but each billing a FULL MINUTE.
  # Batched into one job they cost one minute instead of four, with identical coverage.
  # `changes` stays separate on purpose: it is the dependency other jobs fan out from, so a
  # doc failure here must not skip backend/frontend/docs and cost you their signal.
  static:
    needs: [changes, reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Keeps its credential, unlike every other job here: the step below runs an explicit
      # `git fetch`, which cannot authenticate against a private repository without it. The
      # rule, asserted by tests/guards/test_workflow_invariants.py, is that a job may drop the
      # credential OR fetch, never neither-nor: dropping it from a fetching job fails closed on
      # a private repo and passes on a public one, which is the worst of both.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7 # zizmor: ignore[artipacked] the credential is kept on purpose, see above
        with:
          fetch-depth: 0 # every guard in this job diffs against the base branch

      # Fetched ONCE, up front. Three guards below diff against this ref, and they must not
      # each discover for themselves whether it is present — the declaration guard treats an
      # unreadable diff as a hard failure, which is only reasonable if the ref is really here.
      - name: Fetch the base branch the guards diff against
        if: github.event_name == 'pull_request'
        run: git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # The scanners this job runs, pinned in requirements-ci.txt; ruff and black constrained
      # by backend/requirements-dev.txt, which already pins them for `make backend`. One
      # source of truth per tool: a second pin here would drift, and then "clean" would mean
      # two different things.
      - name: Install the pinned tools
        run: |
          pip install -q -c requirements-ci.txt zizmor pyyaml pytest
          pip install -q -c backend/requirements-dev.txt ruff black

      # actionlint + zizmor on the workflows, hadolint on the Dockerfiles — the binaries pinned
      # by version and verified by checksum (scripts/ci_tools.sh). One definition in the
      # Makefile; this job, the template self-test and `make check` all run it.
      - name: Workflow + Dockerfile lint (make infra-lint)
        run: make infra-lint ZIZMOR=zizmor CI_TOOLS=/tmp/ci-tools

      # Negative tests proving each guard CAN fail. Runs BEFORE the guards themselves: if a
      # guard has silently stopped working, the fault tests say so by name, rather than every
      # downstream check quietly passing on an input it never really inspected.
      - name: Guard fault tests (make guard-tests)
        env:
          CI_TOOLS: /tmp/ci-tools # the positive control for ci_tools.sh reads the cache above
        run: make guard-tests PY=python3

      # The Definition of Done, made checkable. Skipped for bot authors: a Dependabot PR body is
      # machine-generated and its memory impact is genuinely nil, so requiring a declaration there
      # would train everyone to paste one — and a declaration nobody reads is worse than none.
      # The author type comes from GitHub, not from the PR content, so it cannot be spoofed.
      - name: PR memory-impact declaration matches the diff
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Via the environment, never interpolated into the script: a PR body is untrusted
          # input, and so is a branch name (zizmor: template-injection).
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          python3 scripts/pr_declaration.py --body-file /tmp/pr-body.md \
            --base "origin/${BASE_REF}"

      # ONE list, in the Makefile. This job used to relist each gate script by hand beside
      # the Makefile's own list, and two lists mean a gate can be added to one and forgotten
      # in the other — a gate that joins the local suite and then does not run in CI is
      # indistinguishable from one that runs and passes. `make policy` covers:
      #   guard coverage · unicode hazards · registry honesty · as-built + stale refs ·
      #   production-readiness register · standards honesty · dependency pins
      # tests/guards/test_workflow_invariants.py fails if this job ever calls one of those
      # scripts directly again.
      - name: Repository policy gates (make policy)
        env:
          # secret_scan.py --auto reads these to pick the range: the PR base on a pull request,
          # the previous head on a push. The null sha on a first push means full history.
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: make policy

      # The guards, their fault tests and the session hooks — the trees `make backend` does
      # not reach. Same config file locally and here, so the two cannot disagree about what
      # counts as clean.
      - name: Lint the harness (make harness)
        run: make harness PY=python3

      # An agent trying to make CI green can add # noqa / # type: ignore / # nosemgrep /
      # # pragma: no cover, or change code without a test. This diff-based check fails on net-new
      # suppressions or missing tests. Escape hatches are explicit PR labels a human must apply —
      # so an override is always a conscious act, never silent. See docs/decisions/0004.
      - name: Meta-guard (suppressions, tests, guard files, sensitive paths, exemptions)
        if: github.event_name == 'pull_request'
        env:
          ALLOW_SUPPRESSIONS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-suppressions') }}
          ALLOW_MISSING_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
          ALLOW_GUARDRAIL_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'guardrail-change') }}
          ALLOW_SENSITIVE: ${{ contains(github.event.pull_request.labels.*.name, 'sensitive-change-approved') }}
          ALLOW_EXEMPTIONS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-exemptions') }}
          BASE_REF: ${{ github.base_ref }} # via env, never interpolated (zizmor: template-injection)
        run: |
          # An array, not a string: an unquoted "$flags" relies on word-splitting (SC2086) and
          # would break the moment a flag ever contained a space.
          flags=()
          if [ "$ALLOW_SUPPRESSIONS" = "true" ]; then flags+=(--allow-suppressions); fi
          if [ "$ALLOW_MISSING_TESTS" = "true" ]; then flags+=(--allow-missing-tests); fi
          if [ "$ALLOW_GUARDRAIL_CHANGE" = "true" ]; then flags+=(--allow-guardrail-change); fi
          if [ "$ALLOW_SENSITIVE" = "true" ]; then flags+=(--allow-sensitive); fi
          if [ "$ALLOW_EXEMPTIONS" = "true" ]; then flags+=(--allow-exemptions); fi
          python3 scripts/meta_guard.py --base "origin/${BASE_REF}" "${flags[@]}"

      # Advisory only — a warning annotation, never a failure.
      - name: Docs-sync nudge — code changed without a CHANGELOG entry
        if: >-
          github.event_name == 'pull_request' &&
          needs.changes.outputs.code == 'true' &&
          needs.changes.outputs.changelog != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: |
          echo "::warning title=Docs-sync::Code changed but CHANGELOG.md was not updated. Add an entry under [Unreleased], or label this PR 'no-changelog' if intentional."

  # ---- Required-check aggregator (the one check the branch ruleset requires) ----
  # Path-filtered jobs (backend/frontend/docs) don't run on every PR, so none of them can be a
  # required check directly — a required check that never posts blocks the PR forever. This job
  # always runs, fans in every gate, and passes only if each was 'success' or legitimately
  # 'skipped'. The branch ruleset (.github/rulesets/main.json) requires *this* context, so the gate
  # cannot be edited away in-repo. See docs/decisions/0004.
  ci-complete:
    needs: [changes, reuse, hygiene, sast, backend, frontend, docs, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every gate passed (or was skipped)
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "gate results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error title=CI incomplete::A required gate did not pass ($r). Fix it — do not make it non-required."
              exit 1
            fi
          done
          echo "All gates green."
