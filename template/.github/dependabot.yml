# Dependabot — automated dependency & GitHub Actions updates (supply-chain hygiene).
# Targets the repo's default branch. Directories without a manifest are simply no-ops
# until they exist, so entries for optional modules are safe to keep.
#
# Grouping policy: minor/patch bumps are grouped per ecosystem to cut noise, and MAJOR
# bumps are grouped into a single separate PR per ecosystem. A major bump usually needs a
# deliberate migration (a major TypeScript/ESLint bump can fail the gate until code is
# updated), so majors stay visible but land as one reviewable PR instead of flooding a
# brand-new repo with several red ones.
#
# The `docker` entries are load-bearing: base images are pinned by DIGEST, and a pinned
# digest that is never updated silently rots into an unpatched image. Pinning without
# Dependabot would be worse than not pinning at all.
#
# No `target-branch` is set anywhere here, deliberately: the project is trunk-based
# (docs/decisions/0005-trunk-based-branching.md), so the default branch IS the integration
# branch and Dependabot's default is correct. If you ever reintroduce a long-lived branch,
# this file is one of the places that must learn about it — it silently assumed the wrong
# thing last time precisely because it isn't a file anyone thinks of as branching-related.
#
# Bumps that change a GUARD — the workflows (github-actions), the scanners that judge a pull
# request (requirements-ci.txt) and the commit hooks (.pre-commit-config.yaml) — are FLAGGED
# `needs-owner`, never labelled `guardrail-change`. That label is the owner's consent: the
# meta-guard reads it and passes. A bot that applies it approves its own change to what judges
# every pull request. A flagged bump arrives red on the meta-guard and turns green only when the
# owner has read it and applied `guardrail-change` themselves. (This file used to apply it.)
# tests/guards/test_dependabot_coverage.py fails if any entry applies a label a workflow reads.
#
# `cooldown` is not hygiene, it is the premise an argument already rests on. Application
# manifests are deliberately NOT sensitive paths in the meta-guard (scripts/meta_guard.py), so a
# Dependabot bump to one merges on green CI with no label — and that rests on the version
# having been public long enough for a malicious publish to be noticed.
# Without a cooldown, a version published an hour ago can be proposed immediately — down the
# shortest automated path to merge in the repository. Encode the premise an argument rests
# on, or the argument is decoration. tests/guards/test_workflow_invariants.py fails if any
# ecosystem lacks one or sets it below the 7 days the waiver assumes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]
    groups:
      github-actions:
        patterns: ["*"]

  # The scanners that judge a pull request. Pinned in requirements-ci.txt at the repo root,
  # and gated by the meta-guard — so a bump here arrives red, flagged for the owner.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]

  # The commit hooks, pinned by commit SHA in .pre-commit-config.yaml. A pin nothing updates
  # rots; this entry is what that file's "Dependabot updates these" was promising.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
      backend-major:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    # Major bumps of the tooling that GATES the build (typescript 5->7, eslint 9->10,
    # jsdom 26->29) fail the frontend job until the code is migrated, and grouping them
    # does not stop them returning every week — a fresh repo just accumulates red PRs,
    # which trains the adopter to ignore Dependabot. Upgrade these deliberately instead:
    #   npm i -D typescript@latest && npm run lint && npx tsc --noEmit && npm test
    # Runtime dependencies (next, react, react-dom) still receive major bumps.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docs-site"]
    groups:
      docs-site-minor-patch:
        update-types: ["minor", "patch"]
    ignore: # same rationale as frontend
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/*"
        update-types: ["version-update:semver-major"]

  # --- Base images (pinned by digest — see the Dockerfiles) ---
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
