# A pull request that changes a guard needs the owner's `guardrail-change` label.
#
# The template ships this rule (its meta-guard); the template repository holds it too. Its own
# workflow rather than a step in the self-test: it must re-run when the owner applies the label,
# and re-running the whole generation matrix on every label change would bill ~5 job-minutes to
# re-read one label. The ruleset requires this check beside `ci-complete`.
#
# `labeled`/`unlabeled` are load-bearing, not boilerplate: without them the run that decides is
# the one from before the label existed.
name: Guard label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the base branch, to diff against
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Guard files changed only with the owner's label
        env:
          GUARDRAIL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'guardrail-change') }}
          BASE_REF: ${{ github.base_ref }} # via env, never interpolated (zizmor: template-injection)
        run: python3 scripts/check_guard_label.py --base "origin/${BASE_REF}"
