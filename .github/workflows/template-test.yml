# Self-test: generate a project from the template and run ITS gates. This is what
# guarantees a freshly stamped project is green out of the box — the template can't regress.
name: Template self-test

# The scheduled run is load-bearing, not decoration. `npm audit` / `pip-audit` query a LIVE
# advisory database, so a generated project can go from green to red with NO change to this
# repo — a new CVE against a pinned transitive dependency is enough. Push/PR runs alone mean
# the first person to discover that is an adopter, mid-onboarding. Twice now, that is exactly
# what happened. Daily generation + full gate catches it within 24h instead. Cost is ~3
# job-minutes/day; the reputational cost of a day-one-red template is far higher.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC

permissions:
  contents: read

jobs:
  generate-and-gate:
    runs-on: ubuntu-latest
    # This exists because it did not. A Turbopack build wedged under QEMU emulation and burned
    # 38 minutes before anyone looked, with nothing to stop it short of GitHub's six-hour
    # default. The template demands a timeout on every job
    # (tests/guards/test_workflow_invariants.py); the maintainer's own workflow has to hold the
    # same line, or the rule is advice rather than a rule.
    #
    # 40 minutes is the OUTER bound, deliberately generous: the two image-build steps carry
    # their own tighter timeouts below, so a wedge is caught there and fails with a message
    # naming the step, rather than killing the job and losing what every other step found.
    # A healthy full run is ~11 minutes; an emulated webpack build of the frontend measured
    # ~8 minutes locally and GitHub's runners are slower, so the job bound has to clear that
    # comfortably or it becomes a false failure — and a gate that cries wolf gets ignored.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            pname: CI Demo
            extra: ""
          - name: full
            pname: CI Demo
            extra: >-
              --data include_frontend=true --data include_docs_site=true
              --data include_deploy=true --data server_host=example.test
              --data include_compliance_spine=true
          # Regression guard: a long project name/slug is what breaks formatter-checked
          # files — it pushed a Python log line past ruff's 100-char limit, and made
          # prettier re-wrap interpolated TSX. Both were day-one-red bugs that the
          # short "CI Demo" name could never catch. Keep this row long.
          - name: long-name
            pname: Acme Global Compliance And Observability Platform Service
            extra: >-
              --data include_frontend=true --data include_docs_site=true
    name: generate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # tags must be visible for the copier-update gate

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # The same script maintainers run locally before pushing (see MAINTAINING.md) — one
      # artifact, both layers, per the CI-layer-mirroring rule. It explains itself; in short:
      # copier's dirty-repo flow silently drops tracked-but-ignored files from local
      # generations, and a check-ignore failure must fail the step, not read as clean.
      - name: No tracked file is matched by an ignore rule
        run: ./scripts/check-tracked-ignores.sh

      # Runs BEFORE generation, because generation is what a broken template breaks — and it
      # breaks with no filename and a line number into the rendered stream. This names both.
      - name: Every template compiles as Jinja
        run: |
          pip install -q jinja2
          ./scripts/check-jinja-syntax.sh

      - name: Install Copier
        run: pipx install copier

      # --vcs-ref HEAD is LOAD-BEARING. Copier defaults to the latest PEP440 tag when the
      # source is a git repo, so after v1.0.0 was tagged this step silently generated the
      # RELEASE instead of the commit under test — the self-test went green while testing
      # none of the changes in the PR. Content-only edits were invisible; it only surfaced
      # when a commit added a new file. Never remove this flag.
      - name: Generate project
        run: |
          copier copy --defaults --trust --vcs-ref HEAD \
            --data project_name="${{ matrix.pname }}" \
            --data github_owner="ci" \
            --data author_name="CI" \
            --data author_email="ci@example.com" \
            ${{ matrix.extra }} \
            . /tmp/gen

      # Fail loudly if generation ever silently falls back to a tag again.
      - name: Generated project is the commit under test
        run: |
          recorded="$(grep '^_commit:' /tmp/gen/.copier-answers.yml | awk '{print $2}')"
          expected="$(git describe --tags --always HEAD)"
          echo "generated from: $recorded   expected: $expected"
          # Exact comparison, not a pattern: at a tagged commit `expected` legitimately IS the
          # bare tag, so "looks like a tag" would be a false positive. A mismatch means copier
          # resolved something other than the commit under test.
          if [ "$recorded" != "$expected" ]; then
            echo "::error::Self-test generated '$recorded' but HEAD is '$expected'."
            echo "The gates would pass against a different tree than the one in this PR."
            exit 1
          fi

      # The venv goes exactly where CLAUDE.md §4 tells a developer to put it, and the gates
      # below run through `make`, as a developer would. Relisting the commands here was a
      # THIRD copy of the gate list beside the Makefile and the generated project's own CI —
      # and it hid a real defect: `bandit -r . -ll -x tests` excluded nothing (the flag is a
      # prefix match and `-r .` yields `./tests`), which CI never noticed because a runner
      # has no virtualenv, while every developer who followed the setup instructions scanned
      # two million lines of site-packages. A local mirror of CI is a claim about two
      # environments, and only running it in both tests it.
      - name: Provision the venv where a developer puts it
        working-directory: /tmp/gen/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt

      - name: Backend gate (make backend — the developer's command, venv and all)
        working-directory: /tmp/gen
        run: make backend

      - name: Guard fault tests (each guard can still fail)
        working-directory: /tmp/gen
        run: |
          pip install -q -c requirements-ci.txt pyyaml pytest
          python -m pytest tests/guards -q

      # The generated project is not running in its OWN CI event, but it inherits this
      # workflow's event variables. secret_scan.py --auto would read this repository's PR
      # base and try to resolve it in the generated project, which has no remote at all —
      # and refuse, correctly. Cleared, --auto takes the local path: no origin, so it scans
      # the tracked files, which is exactly what a freshly generated project is.
      - name: Repository policy gates (make policy)
        working-directory: /tmp/gen
        env:
          GITHUB_EVENT_NAME: ""
          GITHUB_BASE_REF: ""
          GITHUB_EVENT_BEFORE: ""
        run: make policy

      - name: Lint the harness (make harness)
        working-directory: /tmp/gen
        run: make harness

      # No baseline, deliberately: this is the scan an adopter's FIRST push runs, when the
      # event carries no base sha and the community rules see the whole tree. One finding in
      # a template file and every new project is red on day one, which teaches its owner to
      # lower the gate before they have written a line. The dangerous-ops ruleset runs too.
      - name: SAST on the fresh project (make sast, no baseline — day one must be clean)
        working-directory: /tmp/gen
        run: |
          pip install -q -c requirements-ci.txt semgrep
          make sast

      # `make check` passing is NOT sufficient to commit: the generated repo's own `hygiene`
      # job (and the pre-commit hook `--trust` installs) run these, so a generated file that
      # trips end-of-file-fixer/trailing-whitespace means the adopter's FIRST COMMIT is
      # rejected. Jinja block tags at EOF are the usual culprit — `{% endif %}` on its own
      # last line emits a stray newline. Generation must produce a committable tree.
      # docs-site shipped for months with NO Dependabot coverage: a whole Next.js app whose
      # dependencies — security fixes included — were never updated. It was wired into the
      # Makefile and CI but nothing checked that the cross-cutting systems knew about it.
      # Adding a module means N systems must learn about it; this asserts one of them.
      - name: Every module's manifests have Dependabot coverage
        working-directory: /tmp/gen
        run: |
          pip install -q pyyaml   # not present on the runner's bare Python
          python3 - <<'PY'
          import pathlib, sys, yaml

          root = pathlib.Path(".")
          cfg = yaml.safe_load((root / ".github/dependabot.yml").read_text())
          covered = {(u["package-ecosystem"], u["directory"].rstrip("/") or "/")
                     for u in cfg["updates"]}

          SKIP = {"node_modules", ".venv", ".next", ".git", "__pycache__"}
          MANIFESTS = {"package.json": "npm", "Dockerfile": "docker"}

          required = set()
          for path in root.rglob("*"):
              if any(part in SKIP for part in path.parts) or not path.is_file():
                  continue
              eco = MANIFESTS.get(path.name)
              if path.name.startswith("requirements") and path.suffix == ".txt":
                  eco = "pip"
              if not eco:
                  continue
              rel = path.parent.relative_to(root)
              d = "/" + ("" if str(rel) == "." else str(rel))
              required.add((eco, d.rstrip("/") or "/"))

          missing = sorted(required - covered)
          if missing:
              print("dependabot-coverage: FAILED — module manifests with no Dependabot entry:")
              for eco, d in missing:
                  print(f"  x {eco:8} {d}")
              print("\nAdd them to template/.github/dependabot.yml.")
              sys.exit(1)
          print(f"dependabot-coverage: OK — {len(required)} manifest location(s) all covered.")
          PY

      - name: Generated project passes its own pre-commit hooks
        working-directory: /tmp/gen
        run: |
          pip install pre-commit
          git add -A
          pre-commit run --all-files --show-diff-on-failure

      - name: Frontend gate
        if: matrix.name == 'full'
        working-directory: /tmp/gen/frontend
        run: |
          npm ci
          npm run lint
          npx prettier --check .
          npx tsc --noEmit
          npm audit --omit=dev --audit-level=high
          npm test --if-present
          npm run build
          npm run bundle-size

      - name: Docs-site gate
        if: matrix.name == 'full'
        working-directory: /tmp/gen/docs-site
        run: |
          npm ci
          npm run lint
          npx prettier --check .
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Deploy compose validates
        if: matrix.name == 'full'
        working-directory: /tmp/gen/deploy
        run: |
          cp ../.env.example ../.env
          docker compose --env-file ../.env config >/dev/null                      # local (build override)
          docker compose -f docker-compose.yml --env-file ../.env config >/dev/null # prod (signed images only)

      # ---- Release gate 1: images build on BOTH architectures ----
      # The deploy path ships the arm64 image too; a native dependency (sharp) or a wrong base
      # digest can compile on amd64 and fail on arm64. QEMU makes the arm64 build slow, so this
      # runs on push-to-main + the daily schedule, not on every PR — main stays release-ready
      # without taxing PR feedback. `type=cacheonly` builds both arches and discards the output
      # (a multi-arch manifest can't be `--load`ed), which is exactly the "does it build" check.
      - name: Set up QEMU (cross-arch emulation)
        if: matrix.name == 'full' && github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Buildx
        if: matrix.name == 'full' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Backend image builds on amd64 + arm64
        if: matrix.name == 'full' && github.event_name != 'pull_request'
        # Measured baselines: backend ~2m, frontend ~3m with webpack (and ~8m emulated on a
        # fast laptop). A build past this bound is wedged, not slow — say so by name.
        timeout-minutes: 15
        working-directory: /tmp/gen
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output type=cacheonly backend
      - name: Frontend image builds on amd64 + arm64
        if: matrix.name == 'full' && github.event_name != 'pull_request'
        # Measured baselines: backend ~2m, frontend ~3m with webpack (and ~8m emulated on a
        # fast laptop). A build past this bound is wedged, not slow — say so by name.
        timeout-minutes: 20
        working-directory: /tmp/gen
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output type=cacheonly frontend

      # ---- Release gate 2: `copier update` from the previous release is clean ----
      # Proves a real adopter can pull framework upgrades without losing their own edits. Skips
      # until a release tag exists (the first release has no predecessor), and no-ops if HEAD is
      # the tagged commit itself (empty diff). After v1.0.0, every later change is exercised here.
      - name: Copier update from previous release preserves user files
        if: matrix.name == 'full'
        run: |
          prev="$(git -C "$GITHUB_WORKSPACE" tag --list 'v*' --sort=-version:refname | head -n1)"
          if [ -z "$prev" ]; then
            echo "No previous release tag yet — skipping update gate (first release)."
            exit 0
          fi
          echo "Updating a project generated from $prev up to the current tree..."
          rm -rf /tmp/upd
          copier copy --defaults --trust --vcs-ref "$prev" \
            --data project_name="Update Test" \
            --data github_owner="ci" --data author_name="CI" --data author_email="ci@example.com" \
            --data include_frontend=true --data include_docs_site=true \
            --data include_deploy=true --data server_host=example.test \
            --data include_compliance_spine=true \
            "$GITHUB_WORKSPACE" /tmp/upd
          cd /tmp/upd
          git init -q
          git -c user.email=ci@example.com -c user.name=CI add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "generated from $prev"
          # A user-owned edit that an update must preserve (a 3-way merge, not a clobber).
          printf '\n<!-- USER-OWNED EDIT: must survive copier update -->\n' >> docs/PLAN.md
          git -c user.email=ci@example.com -c user.name=CI commit -aqm "user edit"
          copier update --defaults --trust --vcs-ref HEAD --conflict inline
          grep -q "USER-OWNED EDIT" docs/PLAN.md \
            || { echo "::error::copier update discarded a user-owned edit"; exit 1; }
          # A `.rej`/`.orig` file or an inline conflict marker means a merge the adopter must
          # resolve — acceptable, but the gate should surface it rather than pass silently.
          if git grep -l -e '<<<<<<<' -e '>>>>>>>' -- . >/dev/null 2>&1; then
            echo "::warning::copier update produced conflict markers to resolve (expected on overlapping edits)"
          fi
          echo "copier-update gate: OK — update from $prev applied, user edit preserved."
