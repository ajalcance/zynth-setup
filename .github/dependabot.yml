# Dependabot for the TEMPLATE repository — its own pins, not the ones it ships
# (template/.github/dependabot.yml is what adopters get).
#
# Everything this repository runs is pinned: actions by commit SHA, the self-test's tools in
# requirements-selftest.txt, the hooks by SHA in .pre-commit-config.yaml. A pin nothing
# updates rots into an unpatched dependency, so each has an ecosystem here. The same 7-day
# cooldown the template enforces: a version public for an hour has not been looked at yet.
#
# Changes to the self-test tools and hooks judge every change to this repository, so their
# bumps are FLAGGED with `needs-owner` — never `guardrail-change`. That label is the owner's
# consent: CI reads it and passes the guard check, and a bot that applies it approves its own
# change. So a bump arrives red on `guard-label`, and turns green only when the owner has read it
# and applied `guardrail-change` themselves. tests/test_repo_policy.py fails if any update here
# applies a label a workflow reads as consent. (The template shipped the same mistake: T12.)
#
# `directories: ["/", "/template"]` with one group per ecosystem: Dependabot reads only this
# file, so without the template directory the template's own pins (its CI manifest, its hook
# SHAs, its workflow actions) were never proposed at all — and a root bump arrived alone, into a
# repository that promises one version of each tool (tests/test_shared_pins.py). Grouped across
# both directories, a shared bump is ONE pull request that moves both. The template's backend
# manifests are `.jinja` files Dependabot cannot parse; a ruff or black bump there is by hand,
# and the shared-pin test says so.

version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/template"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: ["/", "/template"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directories: ["/", "/template"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci", "needs-owner"]
    groups:
      pre-commit:
        patterns: ["*"]
