# Pre-commit hooks for the TEMPLATE repository — the same hooks, at the same commit SHAs, as the
# template ships (template/.pre-commit-config.yaml). Setup once: `make venv && make hooks-install`.
#
# Two differences, each with its reason. The whitespace and end-of-file FIXERS skip template/.
# Files there are sources, not outputs — a `.jinja` file that ends in a conditional block must NOT
# end in a newline, or the rendered file gets a blank last line (bit us twice). What template/
# renders into is checked where it matters: the self-test runs the GENERATED project's own
# pre-commit hooks on every generation. The secret hooks see everything, template/ included.
#
# And the end-of-file fixer skips .claude/: it opens every file for WRITING, even one it will
# not change, and the agent's OS sandbox refuses a write-open under .claude/ (ADR 0004) — so
# `make check` failed inside it on files nobody touched. The rule it enforces still holds
# there: tests/test_repo_policy.py reads every tracked .claude/ file, and read-only.
#
# Every `rev:` is a commit SHA with its tag beside it; Dependabot's pre-commit ecosystem
# proposes bumps (.github/dependabot.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '(\.md$|^template/)'
      - id: end-of-file-fixer
        exclude: '^(template|\.claude)/'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '^template/'
