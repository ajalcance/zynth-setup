# =============================================================================
# zynth-setup — Copier template for a new enterprise-grade project.
#
#   copier copy gh:{{ '{{' }} github_owner {{ '}}' }}/zynth-setup my-new-project
#
# Stamps out a project with the full framework already wired: CLAUDE.md working
# contract, docs-as-code system, CI/CD + security gates, pre-commit hooks, and a
# fail-closed backend skeleton whose gates are green on day one.
# =============================================================================

_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Keep the generated project clean: never copy template-repo meta files.
_exclude:
  - copier.yml
  - "~*"
  - "*.pyc"
  - __pycache__
  - ".git"
  - ".venv"

# --- Identity -----------------------------------------------------------------
project_name:
  type: str
  help: Human-readable project name (e.g. "Acme Auth")

project_slug:
  type: str
  help: Repo / directory slug (kebab-case)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

python_package:
  type: str
  help: Python package name under backend/ (snake_case, e.g. "app")
  default: app

project_description:
  type: str
  help: One-line description
  default: ""

# --- Ownership — the OWNER tier: no defaults, by design ------------------------
# An AI agent runs this template far more often than a human does, and it generates with
# `--defaults`. Any question below that carries a default is answered by nobody: the agent
# takes the default, the owner never hears the question, and the project ships with a
# license, a maintainer of record and a review posture that no one chose. So the owner's
# decisions carry NO default, and a validator refuses an empty answer even when one is
# passed. `--defaults` alone refuses to generate (zero files) — the self-test proves it.
# `_message_before_copy` tells the agent what to ask. Everything outside this tier the agent
# may infer from the request.
github_owner:
  type: str
  help: GitHub org or user that will own the repo (the owner's decision — ask them)
  validator: >-
    {% if not (github_owner | trim) %}github_owner is the owner's decision: ask which GitHub
    org or user will own the repository, then pass --data github_owner=...{% endif %}

github_repo:
  type: str
  help: Repository name on GitHub
  default: "{{ project_slug }}"

author_name:
  type: str
  help: Maintainer of record (the owner's decision — ask them)
  validator: >-
    {% if not (author_name | trim) %}author_name is the owner's decision: ask who the
    maintainer of record is, then pass --data author_name=...{% endif %}

author_email:
  type: str
  help: Where security reports and conduct concerns go (SECURITY.md, CODE_OF_CONDUCT.md)
  validator: >-
    {% if '@' not in author_email %}author_email is the owner's decision: ask where security
    reports should go, then pass --data author_email=... (must be an address){% endif %}

license:
  type: str
  help: License for the generated project (the owner's decision — ask them)
  choices:
    - Apache-2.0
    - MIT

initial_version:
  type: str
  help: Starting version
  default: "0.1.0"

# --- Optional stack modules (payloads land in template Phases B/C) ------------
include_frontend:
  type: bool
  help: >-
    Include a Next.js frontend (web UI)? Say yes if the service needs a user-facing
    interface. Adds a JS/TS toolchain + its own CI gate. You can add it later.
  default: false

include_docs_site:
  type: bool
  help: >-
    Include a published documentation website? Say yes to host human-friendly docs
    for others. Adds a second Next.js app to maintain. You can add it later.
  default: false

include_deploy:
  type: bool
  help: >-
    Include the deploy stack (Docker Compose + Caddy, signed-image production deploys)?
    Say yes when you're ready to run this on a real server. You can add it later.
  default: false

server_host:
  type: str
  help: Deploy target host (IP or domain) — used in deploy docs/config (the owner's decision)
  default: ""
  when: "{{ include_deploy }}"
  validator: >-
    {% if include_deploy and not (server_host | trim) %}server_host is the owner's decision:
    the deploy module needs to know where it deploys — ask, then pass --data
    server_host=...{% endif %}

include_compliance_spine:
  type: bool
  help: >-
    Include the compliance/observability spine (tamper-evident audit log + coverage
    guards)? Say yes if you must *prove* what the system did — audits or regulated
    data. Each new action must then satisfy 4 coverage guards. You can add it later.
  default: false

# --- Governance — owner tier: no default -----------------------------------------
solo_maintainer:
  type: bool
  help: >-
    Are you the only maintainer? (The owner's decision — ask them.) GitHub forbids approving
    your own PR, so requiring code-owner review would block EVERY guardrail change and force
    `gh pr merge --admin`. A control bypassed by reflex is worse than none. Yes = gate merges
    on green CI instead (CODEOWNERS still auto-requests review, advisory). No = require
    code-owner review of every guardrail change, which needs a second human.

# --- Local agent ergonomics ---------------------------------------------------
include_claude_hooks:
  type: bool
  help: >-
    Include the Claude Code agent policy (.claude/settings.json + .claude/hooks/)? Sets a
    permission model (routine work runs unprompted; policy/release/destructive actions ask;
    secret reads and the agent's own settings denied) plus hooks that auto-format, block
    footguns, and stop the agent applying your override labels — the one approval CI cannot
    attribute, since it checks a label is present, not who applied it. Gates ONLY those
    files: CLAUDE.md, AGENTS.md and the /dod command are the universal AI working contract
    and always ship. CI and the branch ruleset remain the fail-closed backstop.
  default: true

# --- Post-generation setup (runs only with `copier copy --trust`) -------------
# Tasks execute shell commands, so Copier gates them behind --trust. The Python
# setup is best-effort (|| echo) so a fresh generation never hard-fails offline.
_tasks:
  # Stamp the current year into LICENSE (Jinja has no date; tasks always run since --trust is
  # required). Fills MIT `Copyright (c) <name>` and the Apache appendix `Copyright [yyyy] <name>`.
  # Best-effort (|| true): a year-less license is still valid if this ever no-ops.
  - >-
    python3 -c 'import datetime,pathlib,re;
    y=str(datetime.date.today().year);
    f=pathlib.Path("LICENSE");
    t=f.read_text() if f.exists() else "";
    t=t.replace("Copyright [yyyy] ","Copyright "+y+" ");
    t=re.sub(r"Copyright \(c\) (?!\d)","Copyright (c) "+y+" ",t);
    f.exists() and f.write_text(t)'
    || true
  - "git init -q -b main && git add -A"
  - >-
    python3 -m venv backend/.venv
    && backend/.venv/bin/pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt pre-commit
    && backend/.venv/bin/pip install -q -c requirements-ci.txt zizmor
    && backend/.venv/bin/pre-commit install
    || echo '❌ SETUP INCOMPLETE — backend deps did not install (offline?). Run `make preflight` for the exact fix.'
  # (zizmor is pinned with the CI scanners in requirements-ci.txt, not with the backend dev
  # tools: one source for its version. `make infra-lint`, part of `make check`, needs it.)
  # Invariant: whatever `make check` runs, --trust must have provisioned. `make check` includes
  # the frontend / docs-site gates when those modules are enabled, so their node_modules must
  # exist — otherwise the first `make check` dies with `sh: eslint: command not found`.
  - >-
    {% if include_frontend %}cd frontend && npm ci --no-audit --no-fund
    || echo '❌ SETUP INCOMPLETE — frontend deps did not install (offline?). Run `make preflight` for the exact fix.'{% else %}true{% endif %}
  - >-
    {% if include_docs_site %}cd docs-site && npm ci --no-audit --no-fund
    || echo '❌ SETUP INCOMPLETE — docs-site deps did not install (offline?). Run `make preflight` for the exact fix.'{% else %}true{% endif %}

# Shown before any question — and under --defaults, where it is the only prompt an agent sees.
_message_before_copy: |
  zynth-setup — read this before generating.

  If you are an AI agent running this for someone: the OWNER tier has no defaults, because
  those answers are the owner's decisions, not yours. Ask the owner, in plain words, and pass
  the answers with --data:
    · github_owner     which GitHub org or user will own the repository?
    · author_name      who is the maintainer of record?
    · author_email     where should security reports go? (an address)
    · license          Apache-2.0 or MIT?
    · solo_maintainer  are you the only maintainer? yes: merges gate on green CI, review is
                       advisory. no: every guardrail change needs a second human's review.
    · server_host      only with include_deploy=true: where does it deploy?
  Everything else — project name, slug, package, which modules — you may infer from the
  request. `--defaults` without the owner tier refuses to generate; that is intended.

_message_after_copy: |
  ✅ {{ project_name }} scaffolded.

  Decisions recorded (also in ONBOARDING.md and .copier-answers.yml):
    owner {{ github_owner }} · maintainer {{ author_name }} <{{ author_email }}> · license {{ license }}
    {% if solo_maintainer %}solo maintainer — merges gate on green CI; code-owner review is advisory{% else %}two-person — every guardrail change needs a code-owner review from someone other than the author{% endif %}
    modules — frontend={{ include_frontend }} docs-site={{ include_docs_site }} deploy={{ include_deploy }}{% if include_deploy %} ({{ server_host }}){% endif %} spine={{ include_compliance_spine }} hooks={{ include_claude_hooks }}

  Next steps (run from the project root):
    make preflight                              # confirms the toolchain installed correctly
    make check && make dod-check                # the full gate — green on a fresh project

  Setup is best-effort so an offline generation still works. If you saw a
  "SETUP INCOMPLETE" line above, `make preflight` prints exactly what to run.

  If you generated without --trust, set up the venv manually (see the README Quick start).
  Review the staged files, then make your first commit.
